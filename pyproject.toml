[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muni"
version = "0.1.0"
description = "A trading strategy backtesting tool"
dependencies = [
    "yfinance",
    "pandas",
    "pyarrow",
    "matplotlib",
    "yfinance-cache",   # To help with Yahoo Finance API rate limits
]

[tool.setuptools.packages.find]
where = ["src"]