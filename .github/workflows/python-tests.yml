name: Python Unit Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up subsequent runs

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the current project and its dependencies
        pip install -e ".[test]"

    - name: Run Pytest
      run: |
        # Use -m unit to run only unit tests (excluding integration/e2e)
        pytest -m unit